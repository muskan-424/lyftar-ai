# Render blueprint for the backend (Docker). The frontend is deployed separately
# (Vercel / Netlify / Cloudflare Pages) with VITE_API_BASE_URL set to this service's URL.
services:
  - type: web
    name: llm-chat-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    # Free plan: the filesystem is ephemeral, so SQLite history resets on redeploy and when the
    # service spins down after idling. To keep history, switch to a paid plan (e.g. `plan: starter`)
    # and add a persistent disk:
    #   disk:
    #     name: app-data
    #     mountPath: /data
    #     sizeGB: 1
    plan: free
    envVars:
      - key: LLM_API_KEYS
        sync: false # paste your keys in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false # your frontend URL, e.g. https://my-chat.vercel.app
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
